function u8(b){var r=atob(b),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function unlock(auto){
  var err=document.getElementById('err');err.textContent='';
  if(!window.crypto||!crypto.subtle){err.textContent='افتح الملف من رابط https أو من الجهاز مباشرة.';return;}
  var pw=auto?(sessionStorage.getItem('gp')||''):document.getElementById('pw').value;if(!pw)return;
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));
    var html=new TextDecoder().decode(buf);try{sessionStorage.setItem('gp',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){try{sessionStorage.removeItem('gp');}catch(x){} if(!auto)err.textContent='كلمة السر غير صحيحة';}
}
document.getElementById('go').onclick=function(){unlock(false);};
try{if(sessionStorage.getItem('gp'))unlock(true);}catch(e){}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock(false);});
</script></body></html>
